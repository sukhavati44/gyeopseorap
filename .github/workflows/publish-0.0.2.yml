name: Publish verified 0.0.2 Beta ZIP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.0.2.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish-0.0.2-beta
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sukhavati44/gyeopseorap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify original ZIP and publish prerelease
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, json, base64, hashlib, urllib.request, urllib.error, urllib.parse
          repo = os.environ['GITHUB_REPOSITORY']
          api = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          expected = '8f13b9026b460b463a962baa4276791e825677486e878c0baf1911a4c5af535b'
          tag = 'v0.0.2-beta'
          source_commit = '954476768fe564347d4239026c1b332f64c9cb21'
          filename = 'gyeopseorap-0.0.2-beta-windows-x64.zip'
          def request(url, method='GET', data=None, mime='application/json'):
              if isinstance(data, dict): data = json.dumps(data, ensure_ascii=False).encode('utf-8')
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                         'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'gyeopseorap-release', 'Content-Type': mime}
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers, method=method), timeout=120) as response:
                  return json.load(response)
          blob = request(api + '/git/blobs/aa5776a171c9f6e4baa3d3a031e6cb0ac516fcdc')
          payload = base64.b64decode(blob['content'])
          assert len(payload) == 1095475 and hashlib.sha256(payload).hexdigest() == expected, 'Artifact checksum mismatch'
          try:
              release = request(api + '/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              notes = '\n'.join([
                  '겹서랍의 두 번째 공개 시험 버전입니다.',
                  '수행평가 자료와 점수·관찰 기록을 다층 작업표로 관리하는 Windows 로컬 프로그램입니다.',
                  '', '- 선택형 열 배점 메모와 가능한 점수 조합 대조 안내',
                  '- 학생 개별조회: 선택 항목 기준 하위 3층까지 조회',
                  '- 기록 내보내기: 학생별 전체 자료·메모·이력·연결을 독립 XLSX로 출력',
                  '- 1인/학급 단위, 이름/둘 다/코드 선택 지원',
                  '- 배점 불일치 글씨와 상태 영역 표시 개선',
                  '', 'Windows 64비트와 데스크톱 Microsoft Excel이 필요합니다.',
                  'ZIP을 완전히 풀고 겹서랍 폴더의 START.exe를 실행하세요. 프로젝트 자료는 별도 보관합니다.',
                  '기존 프로젝트는 먼저 백업하고 사본으로 시험하세요.',
                  '코드만 출력해도 원문 내용·메모에 포함된 실명은 자동으로 지우지 않습니다.',
                  '', 'SHA-256: ' + expected])
              release = request(api + '/releases', 'POST', {'tag_name': tag, 'target_commitish': source_commit,
                  'name': '겹서랍 Beta 0.0.2', 'body': notes, 'draft': True, 'prerelease': True, 'make_latest': 'false'})
          assert release['tag_name'] == tag and release['prerelease'], 'Unexpected existing release'
          existing = [a for a in release['assets'] if a['name'] == filename]
          if existing:
              assert len(existing) == 1 and existing[0]['size'] == len(payload) and existing[0].get('digest') == 'sha256:' + expected, 'Existing asset differs; not overwritten'
              asset = existing[0]
          else:
              upload = release['upload_url'].split('{')[0] + '?' + urllib.parse.urlencode({'name': filename})
              asset = request(upload, 'POST', payload, 'application/zip')
          assert asset['state'] == 'uploaded' and asset['size'] == len(payload), 'Upload incomplete'
          assert asset.get('digest') in (None, 'sha256:' + expected), 'Uploaded asset digest differs'
          if release['draft']:
              release = request(api + '/releases/' + str(release['id']), 'PATCH', {'draft': False, 'prerelease': True, 'make_latest': 'false'})
          print('Published:', release['html_url'])
          print('Asset:', asset['name'], asset['size'], 'bytes; SHA-256 verified')
